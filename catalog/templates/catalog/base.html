<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Price book{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF8; --ink:#15171A; --line:#E3E2DD; --line-strong:#C9C8C1;
    --muted:#8B8D85; --card:#FFFFFF;
    --wholesale:#1D4FD6; --wholesale-bg:#EAF0FE;
    --retail:#96700D; --retail-bg:#F5EFDD;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px;}

  /* --- signature mark: a barcode stripe, echoes the scan feature --- */
  .brand{display:flex;align-items:center;gap:10px;}
  .barcode-mark{width:20px;height:22px;flex-shrink:0;
    background:repeating-linear-gradient(90deg,
      var(--ink) 0px, var(--ink) 2px, transparent 2px, transparent 3px,
      var(--ink) 3px, var(--ink) 4px, transparent 4px, transparent 6px,
      var(--ink) 6px, var(--ink) 7px, transparent 7px, transparent 8px,
      var(--ink) 8px, var(--ink) 9px, transparent 9px, transparent 11px,
      var(--ink) 11px, var(--ink) 12px, transparent 12px, transparent 13px);}

  header{display:flex;align-items:center;justify-content:space-between;
    margin-bottom:22px;flex-wrap:wrap;gap:8px;padding-bottom:16px;
    border-bottom:1px solid var(--line-strong);}
  h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .count{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  nav{display:flex;gap:16px;}
  nav a{font-size:13px;color:var(--ink);text-decoration:none;
    border-bottom:1px solid var(--line-strong);padding-bottom:1px;}
  nav a:hover{border-color:var(--ink);}

  /* --- Landing state: nothing but the scanner, centered --- */
  .hero{
    min-height:72vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;text-align:center;
  }
  .barcode-mark-lg{width:34px;height:38px;margin-bottom:10px;}
  .hero-title{font-size:22px;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .hero-sub{font-size:14px;color:var(--muted);margin:0 0 22px;}
  .toolbar-centered{width:100%;max-width:420px;justify-content:center;}
  .toolbar-centered input{width:100%;}
  .hero-nav{display:flex;gap:16px;margin-top:26px;}
  .hero-nav a{font-size:12px;color:var(--muted);text-decoration:none;
    border-bottom:1px solid transparent;padding-bottom:1px;}
  .hero-nav a:hover{color:var(--ink);border-color:var(--line-strong);}
  .toolbar-wrap{margin-bottom:8px;}
  .price.muted{background:transparent;color:var(--muted);border:1px dashed var(--line-strong);}
  .warn-btn{
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    width:22px;height:22px;border-radius:50%;border:none;background:transparent;
    color:#B5390B;cursor:pointer;padding:0;
  }
  .warn-btn:hover{background:#FBEAE3;}
  .field-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line);}
  .field-row:last-child{border-bottom:none;}
  .field-label{font-size:13px;color:var(--muted);}
  .field-value{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .field-action{display:flex;gap:6px;align-items:center;}
  .field-action input{width:110px;padding:6px 8px;font-size:13px;}
  .field-action .btn,.field-action .show-btn{padding:6px 10px;font-size:12px;}
  .inline-status{font-size:12px;margin-top:8px;}
  .inline-status.error{color:#B5390B;}
  .inline-status.success{color:#1D6B3B;}

  form.toolbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  input,select,textarea{font-size:14px;border:1px solid var(--line-strong);
    border-radius:4px;padding:9px 12px;background:var(--card);color:var(--ink);
    font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);}
  #q{width:100%;}
  #suggestions{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;
    background:var(--card);border:1px solid var(--line-strong);border-radius:4px;
    overflow:hidden;display:none;
  }
  #suggestions.open{display:block;}
  .suggestion{
    display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .suggestion:last-child{border-bottom:none;}
  .suggestion:hover,.suggestion.active{background:var(--paper);}
  .suggestion .s-code{font-size:11px;color:var(--muted);min-width:52px;font-family:'IBM Plex Mono',monospace;}
  .suggestion .s-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .suggestion .s-price{font-size:11px;color:var(--retail);white-space:nowrap;font-family:'IBM Plex Mono',monospace;}

  .btn{font-weight:500;font-size:14px;font-family:inherit;border:1px solid var(--ink);border-radius:4px;
    padding:9px 14px;background:var(--ink);color:var(--paper);cursor:pointer;line-height:1.3;}
  .btn:hover{opacity:0.85;}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);}
  .btn.ghost:hover{border-color:var(--ink);opacity:1;}
  .btn svg{vertical-align:-2px;margin-right:5px;}

  .cat-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;
    letter-spacing:0.06em;margin:22px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line-strong);}
  .row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);}
  .show-btn{
    font-family:inherit;font-size:12px;font-weight:500;
    border:1px solid var(--line-strong);color:var(--ink);background:transparent;
    border-radius:4px;padding:5px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0;
  }
  .show-btn:hover{border-color:var(--ink);}
  .row .code{font-size:12px;color:var(--muted);min-width:56px;font-family:'IBM Plex Mono',monospace;}
  .row .name{flex:1;font-size:14px;}
  .price{font-size:12px;font-weight:500;padding:3px 7px;font-family:'IBM Plex Mono',monospace;
    border-radius:4px;white-space:nowrap;}
  .price.wholesale{background:var(--wholesale-bg);color:var(--wholesale);}
  .price.retail{background:var(--retail-bg);color:var(--retail);}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:48px 0;}

  .messages{list-style:none;padding:0;margin:0 0 16px;}
  .messages li{border:1px solid var(--line-strong);border-left:3px solid var(--ink);
    padding:10px 14px;font-size:14px;border-radius:2px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(21,23,26,0.55);z-index:100;
    display:none;align-items:center;justify-content:center;padding:16px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--card);border-radius:6px;padding:18px;
    max-width:420px;width:100%;
  }
  .modal-box h3{margin:0 0 12px;font-size:15px;font-weight:600;}
  #reader{width:100%;border-radius:4px;overflow:hidden;background:#000;min-height:240px;position:relative;}
  .scan-guide{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:80%;max-width:280px;height:110px;
    border:2px solid #fff;border-radius:4px;
    box-shadow:0 0 0 2000px rgba(0,0,0,0.4);
    pointer-events:none;
  }
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .scan-status{font-size:12px;color:var(--muted);}

  /* --- Customer-facing full-screen price display --- */
  .customer-display{
    position:fixed;inset:0;z-index:200;background:var(--ink);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;
  }
  .customer-display.open{display:flex;}
  .cd-close{
    position:absolute;top:18px;right:18px;background:transparent;
    border:1px solid rgba(250,250,248,0.25);color:var(--paper);font-size:16px;width:38px;height:38px;
    border-radius:50%;cursor:pointer;line-height:1;
  }
  .cd-close:hover{border-color:rgba(250,250,248,0.6);}
  .cd-content{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .cd-item-no{
    font-size:14px;letter-spacing:0.1em;font-family:'IBM Plex Mono',monospace;
    color:rgba(250,250,248,0.5);text-transform:uppercase;
  }
  .cd-name{font-size:20px;color:var(--paper);font-weight:600;max-width:90vw;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Public Sans',sans-serif;}
  .cd-price-label{
    font-size:13px;font-weight:600;color:rgba(250,250,248,0.55);
    text-transform:uppercase;letter-spacing:0.08em;margin-top:18px;
  }
  .cd-price{
    font-size:104px;font-weight:600;color:var(--paper);line-height:1;
    font-family:'IBM Plex Mono',monospace;
    margin:6px 0 24px;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;
    border-bottom:3px solid rgba(250,250,248,0.3);
    padding-bottom:14px;
  }
  .cd-loading{color:var(--paper);font-size:16px;}
  .cd-not-found{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .cd-not-found-icon{
    width:56px;height:56px;border-radius:50%;border:1px solid rgba(250,250,248,0.3);
    color:var(--paper);font-size:26px;display:flex;align-items:center;justify-content:center;
  }
  .cd-not-found-text{color:var(--paper);font-size:18px;font-family:'Public Sans',sans-serif;}
  .cd-not-found-code{color:rgba(250,250,248,0.5);font-size:13px;font-family:'IBM Plex Mono',monospace;}
  .cd-extra-prices{
    display:flex;flex-direction:column;gap:6px;margin-top:-8px;width:100%;max-width:320px;
  }
  .cd-extra-row{
    display:flex;justify-content:space-between;gap:16px;
    font-size:14px;color:rgba(250,250,248,0.75);font-family:'IBM Plex Mono',monospace;
    padding:8px 2px;border-top:1px solid rgba(250,250,248,0.12);
  }
  .cd-switch-btn{
    margin-top:22px;font-family:'Public Sans',sans-serif;font-size:13px;font-weight:500;
    background:transparent;border:1px solid rgba(250,250,248,0.3);color:var(--paper);
    border-radius:4px;padding:8px 16px;cursor:pointer;
  }
  .cd-switch-btn:hover{border-color:rgba(250,250,248,0.7);}
  .cd-scan-again{margin-top:22px;}
  @media (max-width:480px){
    .cd-price{font-size:52px;padding-bottom:8px;margin-bottom:18px;}
    .cd-name{font-size:17px;}
  }
  @media (max-width:480px){ .row .code{display:none;} }
</style>
</head>
<body>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
</body>
</html>
